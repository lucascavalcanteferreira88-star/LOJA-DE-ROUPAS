<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estilo & Moda - Loja de Roupas</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">URBAN STYLE</div>

        <div class="cart-icon">
            🛒 Carrinho (<span id="cart-count">0</span>)
        </div>
    </header>

    <section class="hero">
        <h1>Nova Coleção de Inverno</h1>
        <p>As melhores peças com os melhores preços</p>
    </section>

    <main class="container">

        <h2>Nossos Produtos</h2>

        <div class="products-grid">

            <!-- Produto 1 -->
            <div class="product-card">

                <img 
                    src="https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?auto=format&fit=crop&w=500&q=80"
                    alt="Camisa Social"
                >

                <div class="product-info">

                    <div class="product-title">
                        Camisa Social Slim Fit
                    </div>

                    <div class="product-price">
                        R$ 119,90
                    </div>

                    <select class="size-select" id="size-1">
                        <option value="P">Tamanho: P</option>
                        <option value="M">Tamanho: M</option>
                        <option value="G">Tamanho: G</option>
                    </select>

                    <button 
                        class="btn-add"
                        onclick="addToCart('Camisa Social Slim Fit', 119.90, 'size-1')"
                    >
                        Adicionar ao Carrinho
                    </button>

                </div>
            </div>


            <!-- Produto 2 -->
            <div class="product-card">

                <img 
                    src="https://images.unsplash.com/photo-1541099649105-f69ad21f3246?auto=format&fit=crop&w=500&q=80"
                    alt="Calça Jeans"
                >

                <div class="product-info">

                    <div class="product-title">
                        Calça Jeans Masculina
                    </div>

                    <div class="product-price">
                        R$ 159,90
                    </div>

                    <select class="size-select" id="size-2">
                        <option value="38">Tamanho: 38</option>
                        <option value="40">Tamanho: 40</option>
                        <option value="42">Tamanho: 42</option>
                    </select>

                    <button 
                        class="btn-add"
                        onclick="addToCart('Calça Jeans Masculina', 159.90, 'size-2')"
                    >
                        Adicionar ao Carrinho
                    </button>

                </div>
            </div>


            <!-- Produto 3 -->
            <div class="product-card">

                <img 
                    src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=500&q=80"
                    alt="Tênis Esportivo"
                >

                <div class="product-info">

                    <div class="product-title">
                        Tênis Red Runner
                    </div>

                    <div class="product-price">
                        R$ 249,90
                    </div>

                    <select class="size-select" id="size-3">
                        <option value="39">Tamanho: 39</option>
                        <option value="40">Tamanho: 40</option>
                        <option value="41">Tamanho: 41</option>
                    </select>

                    <button 
                        class="btn-add"
                        onclick="addToCart('Tênis Red Runner', 249.90, 'size-3')"
                    >
                        Adicionar ao Carrinho
                    </button>

                </div>
            </div>

        </div>


        <!-- Checkout -->
        <section class="checkout-section">

            <h2>Finalizar Compra</h2>

            <div class="checkout-container">

                <!-- Carrinho -->
                <div class="cart-summary">

                    <h3>Seu Carrinho</h3>

                    <div id="cart-items">
                        <p class="empty-cart">
                            Seu carrinho está vazio.
                        </p>
                    </div>

                    <div class="cart-total">
                        Total: R$ 
                        <span id="cart-total-price">0,00</span>
                    </div>

                </div>


                <!-- Formulário -->
                <div>

                    <h3>Dados de Entrega</h3>

                    <form id="order-form" onsubmit="submitOrder(event)">

                        <div class="form-group">

                            <label for="name">
                                Nome Completo:
                            </label>

                            <input 
                                type="text"
                                id="name"
                                required
                                placeholder="Ex: João Silva"
                            >

                        </div>


                        <div class="form-group">

                            <label for="phone">
                                Telefone / WhatsApp:
                            </label>

                            <input 
                                type="tel"
                                id="phone"
                                required
                                placeholder="Ex: (11) 99999-9999"
                            >

                        </div>


                        <div class="form-group">

                            <label for="email">
                                E-mail:
                            </label>

                            <input 
                                type="email"
                                id="email"
                                required
                                placeholder="Ex: joao@email.com"
                            >

                        </div>


                        <div class="form-group">

                            <label for="address">
                                Endereço de Entrega (Rua, Nº, Bairro):
                            </label>

                            <input 
                                type="text"
                                id="address"
                                required
                                placeholder="Ex: Av. Paulista, 1000 - Apto 21"
                            >

                        </div>


                        <div class="form-group">

                            <label for="city">
                                Cidade / Estado:
                            </label>

                            <input 
                                type="text"
                                id="city"
                                required
                                placeholder="Ex: São Paulo / SP"
                            >

                        </div>


                        <button 
                            type="submit"
                            class="btn-submit"
                        >
                            Confirmar Pedido
                        </button>

                    </form>

                </div>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
